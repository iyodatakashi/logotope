# ---- Topic queries ----

query GetTopics @auth(level: NO_ACCESS) {
  debateTopics(orderBy: [{ createdAt: DESC }]) {
    id
    title
    status
    createdAt
    updatedAt
  }
}

query GetTopicById($id: UUID!) @auth(level: NO_ACCESS) {
  debateTopic(id: $id) {
    id
    title
    status
    createdAt
    updatedAt
  }
}

# ---- StakeholderMap queries ----

query GetStakeholderMapByTopicId($topicId: UUID!) @auth(level: NO_ACCESS) {
  stakeholderMaps(where: { topicId: { eq: $topicId } }) {
    id
    topicId
    content
    approved
    createdAt
  }
}

# ---- PersonaProfile queries ----

query GetPersonasByTopicId($topicId: UUID!) @auth(level: NO_ACCESS) {
  personaProfiles(
    where: { topicId: { eq: $topicId } }
    orderBy: [{ sortOrder: ASC }]
  ) {
    id
    topicId
    stakeholderRole
    name
    age
    occupation
    background
    interests
    stanceDirection
    approved
    sortOrder
  }
}

query GetApprovedPersonasByTopicId($topicId: UUID!) @auth(level: NO_ACCESS) {
  personaProfiles(
    where: { topicId: { eq: $topicId }, approved: { eq: true } }
    orderBy: [{ sortOrder: ASC }]
  ) {
    id
    topicId
    stakeholderRole
    name
    age
    occupation
    background
    interests
    stanceDirection
    approved
    sortOrder
  }
}

# ---- PersonaInterview queries ----

query GetPersonaInterviewByPersonaId($personaId: UUID!) @auth(level: NO_ACCESS) {
  personaInterviews(where: { personaId: { eq: $personaId } }) {
    id
    personaId
    interviewRecord
    status
    errorMessage
    completedAt
  }
}

# ---- PersonaBelief queries ----

query GetPersonaBeliefsByPersonaId($personaId: UUID!) @auth(level: NO_ACCESS) {
  personaBeliefs(
    where: { personaId: { eq: $personaId } }
    orderBy: [{ version: ASC }]
  ) {
    id
    personaId
    version
    content
    changeType
    changeSummary
    triggeredByTurnId
    createdAt
  }
}

query GetPersonaBeliefHistoryByTopicId($topicId: UUID!) @auth(level: NO_ACCESS) {
  personaProfiles(
    where: { topicId: { eq: $topicId } }
    orderBy: [{ sortOrder: ASC }]
  ) {
    id
    name
    stakeholderRole
    personaBeliefs_on_persona(orderBy: [{ version: ASC }]) {
      id
      version
      content
      changeType
      changeSummary
      triggeredByTurnId
    }
  }
}

# ---- DebateSession queries ----

query GetDebateSessionByTopicId($topicId: UUID!) @auth(level: NO_ACCESS) {
  debateSessions(where: { topicId: { eq: $topicId } }) {
    id
    topicId
    status
    totalTurns
    createdAt
    completedAt
    publishedAt
  }
}

# ---- DebateTurn queries ----

query GetDebateTurnsBySessionId($sessionId: UUID!) @auth(level: NO_ACCESS) {
  debateTurns(
    where: { sessionId: { eq: $sessionId } }
    orderBy: [{ turnIndex: ASC }]
  ) {
    id
    sessionId
    turnIndex
    speakerType
    personaId
    content
    createdAt
  }
}

# ---- PostDebateComment queries ----

query GetPostDebateCommentsBySessionId($sessionId: UUID!) @auth(level: NO_ACCESS) {
  postDebateComments(
    where: { sessionId: { eq: $sessionId } }
    orderBy: [{ sortOrder: ASC }]
  ) {
    id
    sessionId
    personaId
    content
    sortOrder
  }
}

# ---- Public debate queries ----

query GetPublishedDebates @auth(level: NO_ACCESS) {
  debateSessions(
    where: { publishedAt: { isNull: false } }
    orderBy: [{ publishedAt: DESC }]
  ) {
    id
    totalTurns
    publishedAt
    topic {
      id
      title
    }
  }
}

query GetPublishedDebateById($sessionId: UUID!) @auth(level: NO_ACCESS) {
  debateSession(id: $sessionId) {
    id
    totalTurns
    publishedAt
    topic {
      id
      title
    }
    debateTurns_on_session(orderBy: [{ turnIndex: ASC }]) {
      id
      turnIndex
      speakerType
      content
      persona {
        id
        name
        stakeholderRole
      }
      personaBeliefs_on_triggeredByTurn {
        id
        changeType
        changeSummary
        persona {
          id
          name
        }
      }
    }
    postDebateComments_on_session(orderBy: [{ sortOrder: ASC }]) {
      id
      content
      sortOrder
      persona {
        id
        name
        stakeholderRole
      }
    }
  }
}
