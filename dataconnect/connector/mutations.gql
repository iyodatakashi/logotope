# ---- Topic mutations ----

mutation CreateDebateTopic($title: String!) @auth(level: NO_ACCESS) {
  debateTopic_insert(data: {
    title: $title
    status: "pending"
  })
}

mutation UpdateDebateTopicStatus($id: UUID!, $status: String!) @auth(level: NO_ACCESS) {
  debateTopic_update(
    id: $id
    data: {
      status: $status
      updatedAt_expr: "request.time"
    }
  )
}

# ---- StakeholderMap mutations ----

mutation CreateStakeholderMap($topicId: UUID!, $content: String!) @auth(level: NO_ACCESS) {
  stakeholderMap_insert(data: {
    topicId: $topicId
    content: $content
  })
}

mutation ApproveStakeholderMap($id: UUID!) @auth(level: NO_ACCESS) {
  stakeholderMap_update(
    id: $id
    data: { approved: true }
  )
}

# ---- PersonaProfile mutations ----

mutation CreatePersonaProfile(
  $topicId: UUID!
  $stakeholderRole: String!
  $name: String!
  $age: Int!
  $occupation: String!
  $background: String!
  $interests: String!
  $stanceDirection: String!
  $sortOrder: Int!
) @auth(level: NO_ACCESS) {
  personaProfile_insert(data: {
    topicId: $topicId
    stakeholderRole: $stakeholderRole
    name: $name
    age: $age
    occupation: $occupation
    background: $background
    interests: $interests
    stanceDirection: $stanceDirection
    sortOrder: $sortOrder
  })
}

mutation ApprovePersonaProfiles($topicId: UUID!) @auth(level: NO_ACCESS) {
  personaProfile_updateMany(
    where: { topicId: { eq: $topicId } }
    data: { approved: true }
  )
}

# ---- PersonaInterview mutations ----

mutation CreatePersonaInterview($personaId: UUID!, $interviewRecord: String!) @auth(level: NO_ACCESS) {
  personaInterview_insert(data: {
    personaId: $personaId
    interviewRecord: $interviewRecord
    status: "pending"
  })
}

mutation CreateCompletedPersonaInterview($personaId: UUID!, $interviewRecord: String!) @auth(level: NO_ACCESS) {
  personaInterview_insert(data: {
    personaId: $personaId
    interviewRecord: $interviewRecord
    status: "completed"
    completedAt_expr: "request.time"
  })
}

mutation CreateErrorPersonaInterview($personaId: UUID!, $errorMessage: String!) @auth(level: NO_ACCESS) {
  personaInterview_insert(data: {
    personaId: $personaId
    interviewRecord: ""
    status: "error"
    errorMessage: $errorMessage
  })
}

mutation UpdatePersonaInterviewStatus($id: UUID!, $status: String!, $errorMessage: String) @auth(level: NO_ACCESS) {
  personaInterview_update(
    id: $id
    data: {
      status: $status
      errorMessage: $errorMessage
    }
  )
}

mutation CompletePersonaInterview($id: UUID!, $interviewRecord: String!) @auth(level: NO_ACCESS) {
  personaInterview_update(
    id: $id
    data: {
      interviewRecord: $interviewRecord
      status: "completed"
      completedAt_expr: "request.time"
    }
  )
}

# ---- PersonaBelief mutations ----

mutation CreatePersonaBelief(
  $personaId: UUID!
  $version: Int!
  $content: String!
  $changeType: String
  $changeSummary: String
  $triggeredByTurnId: UUID
) @auth(level: NO_ACCESS) {
  personaBelief_insert(data: {
    personaId: $personaId
    version: $version
    content: $content
    changeType: $changeType
    changeSummary: $changeSummary
    triggeredByTurnId: $triggeredByTurnId
  })
}

# ---- DebateSession mutations ----

mutation CreateDebateSession($topicId: UUID!) @auth(level: NO_ACCESS) {
  debateSession_insert(data: {
    topicId: $topicId
    status: "running"
  })
}

mutation UpdateDebateSessionStatus($id: UUID!, $status: String!) @auth(level: NO_ACCESS) {
  debateSession_update(
    id: $id
    data: { status: $status }
  )
}

mutation CompleteDebateSession($id: UUID!, $totalTurns: Int!) @auth(level: NO_ACCESS) {
  debateSession_update(
    id: $id
    data: {
      status: "completed"
      totalTurns: $totalTurns
      completedAt_expr: "request.time"
    }
  )
}

mutation PublishDebateSession($id: UUID!) @auth(level: NO_ACCESS) {
  debateSession_update(
    id: $id
    data: {
      status: "published"
      publishedAt_expr: "request.time"
    }
  )
}

# ---- DebateTurn mutations ----

mutation CreateDebateTurn(
  $sessionId: UUID!
  $turnIndex: Int!
  $speakerType: String!
  $personaId: UUID
  $content: String!
) @auth(level: NO_ACCESS) {
  debateTurn_insert(data: {
    sessionId: $sessionId
    turnIndex: $turnIndex
    speakerType: $speakerType
    personaId: $personaId
    content: $content
  })
}

# ---- Reset delete mutations (by topicId) ----

mutation DeletePersonaProfilesByTopicId($topicId: UUID!) @auth(level: NO_ACCESS) {
  personaProfile_deleteMany(where: { topicId: { eq: $topicId } })
}

mutation DeletePersonaInterviewsByTopicId($topicId: UUID!) @auth(level: NO_ACCESS) {
  personaInterview_deleteMany(where: { persona: { topicId: { eq: $topicId } } })
}

mutation DeletePersonaBeliefsByTopicId($topicId: UUID!) @auth(level: NO_ACCESS) {
  personaBelief_deleteMany(where: { persona: { topicId: { eq: $topicId } } })
}

mutation DeleteDebateSessionByTopicId($topicId: UUID!) @auth(level: NO_ACCESS) {
  debateSession_deleteMany(where: { topicId: { eq: $topicId } })
}

# ---- DebateSession / DebateTurn delete mutations ----

mutation DeleteDebateTurnsBySession($sessionId: UUID!) @auth(level: NO_ACCESS) {
  debateTurn_deleteMany(where: { sessionId: { eq: $sessionId } })
}

mutation DeletePostDebateCommentsBySession($sessionId: UUID!) @auth(level: NO_ACCESS) {
  postDebateComment_deleteMany(where: { sessionId: { eq: $sessionId } })
}

mutation DeleteDebateSession($id: UUID!) @auth(level: NO_ACCESS) {
  debateSession_delete(id: $id)
}

# ---- PostDebateComment mutations ----

mutation CreatePostDebateComment(
  $sessionId: UUID!
  $personaId: UUID!
  $content: String!
  $sortOrder: Int!
) @auth(level: NO_ACCESS) {
  postDebateComment_insert(data: {
    sessionId: $sessionId
    personaId: $personaId
    content: $content
    sortOrder: $sortOrder
  })
}
