runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 0
  maxInstances: 10

# Firebase Web SDK config. These are public client identifiers (embedded in the
# browser bundle), so plain values are fine. Vite inlines them at build time,
# hence BUILD availability.
env:
  - variable: VITE_FIREBASE_API_KEY
    value: "AIzaSyAKqMNxvpSSEVPNxtr9-uNkmByzdnUKxd4"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: "logotope14.firebaseapp.com"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_PROJECT_ID
    value: "logotope14"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: "logotope14.firebasestorage.app"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    value: "233351764077"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_APP_ID
    value: "1:233351764077:web:ef97e8b9399adb90eac764"
    availability:
      - BUILD

  # AuthConfig.continueUrl の組み立てに使うアプリのオリジン。
  # 確認・再設定の完了後の戻り先がこのオリジンになるため、
  # Firebase Authentication の承認済みドメインに含まれている必要がある
  - variable: VITE_APP_ORIGIN
    value: "https://logotope--logotope14.asia-east1.hosted.app"
    availability:
      - BUILD

  # 管理画面の自前登録を許すか。画面の入口・登録経路の到達可否をこの1つから導く。
  # 登録 API 自体は Firebase コンソールの User actions でしか塞げない（防御はそちら）
  - variable: VITE_SELF_REGISTRATION
    value: "false"
    availability:
      - BUILD
